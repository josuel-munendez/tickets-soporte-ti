# Compose de desarrollo (AGENTS.md, «+10 pts»): app PHP+Apache + MySQL 8.0.
# Los secretos NO van aquí: se leen de .env (ignorado por Git). Copia .env.example a .env.
services:
  db:
    image: mysql:8.0
    # Sin container_name fijo: Compose nombra <proyecto>-db-1, así no choca con
    # contenedores ajenos que ya usen nombres genéricos como "tickets-db".
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NOMBRE}
      MYSQL_USER: ${DB_USUARIO}
      MYSQL_PASSWORD: ${DB_CONTRASENA}
      TZ: America/Bogota
    ports:
      - "${DB_PUERTO_EXTERNO:-3307}:3306"
    volumes:
      # Esquema y datos de prueba: MySQL los ejecuta la primera vez (initdb).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - tickets_datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Sin container_name fijo (ver nota en el servicio db).
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PUERTO: 3306
      DB_NOMBRE: ${DB_NOMBRE}
      DB_USUARIO: ${DB_USUARIO}
      DB_CONTRASENA: ${DB_CONTRASENA}
      API_KEY: ${API_KEY}
    ports:
      - "${APP_PUERTO:-8080}:80"
    volumes:
      # El entrypoint genera config/config.php desde el entorno (secreto no versionado).
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - tickets_logs:/var/www/html/storage/logs
    entrypoint: ["sh", "/usr/local/bin/entrypoint.sh"]

volumes:
  tickets_datos:
  tickets_logs:
