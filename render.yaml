# Render Blueprint (Infrastructure as Code, opcional).
# Docs: https://render.com/docs/blueprint-spec
#
# IMPORTANTE sobre la base de datos:
#   Render NO ofrece MySQL gestionado de forma nativa (solo PostgreSQL y
#   Key Value/Redis). Para usar este proyecto (MySQL 8.0) en Render tienes dos vías:
#
#   a) MySQL EXTERNO gratuito (Railway, Aiven, Clever Cloud...): creas la base allí,
#      copias su URL de conexión y la pegas a mano en la variable DB_URL de este
#      servicio (NO la enlaza el blueprint). Luego inicializas una sola vez:
#         DB_URL="mysql://usuario:pass@host:puerto/nombre" bash database/init-render.sh
#
#   b) Desplegar TODO en Railway (app + MySQL en el mismo proyecto), que sí trae
#      MySQL con un clic. Ver la sección "Despliegue en línea" del README.
#
# Por eso este blueprint define SOLO el servicio web; DB_URL se configura a mano.

services:
  - type: web
    name: tickets-soporte-ti
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: API_KEY
        generateValue: true        # Render genera una clave aleatoria
      # DB_URL apunta a un MySQL externo; se define en el panel de Render.
      # Formato: mysql://usuario:contrasena@host:puerto/nombre
      - key: DB_URL
        sync: false                # sync:false = valor manual, no versionado
